spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${H2_FILE:./data/procurement};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;${H2_EXTRA:AUTO_SERVER=TRUE}
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
